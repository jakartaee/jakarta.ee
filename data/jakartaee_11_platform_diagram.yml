title: "Jakarta EE 11 Platform"

# Specifications are grouped by the profile that introduces them.
# Visual nesting goes: full_platform → web_profile → core_profile
# Each `path` resolves a page under /content/specifications/<path>/.
# `name` is optional and overrides the display name derived from the
# spec's page title (defaults to title with "Jakarta " prefix and
# "(under development)" suffix stripped).
groups:
  - id: full_platform
    title: ""
    width: single
    grid: false
    specs:
      - path: authorization/3.0
        status: updated
      - path: activation/2.1
        status: not-updated
      - path: batch/2.1
        status: not-updated
      - path: connectors/2.1
        status: not-updated
      - path: mail/2.1
        status: not-updated
      - path: messaging/3.1
        status: not-updated
      - path: enterprise-beans/4.0
        status: not-updated

  - id: web_profile
    title: "Jakarta EE 11 <strong>Web Profile</strong>"
    width: double
    grid: true
    specs:
      - path: authentication/3.1
        status: updated
      - path: data/1.0
        status: new
      - path: concurrency/3.1
        status: updated
      - path: persistence/3.2
        status: updated
      - path: cdi/4.1
        name: "CDI 4.1"
        status: updated
      - path: pages/4.0
        status: updated
      - path: expression-language/6.0
        status: updated
      - path: websocket/2.2
        status: updated
      - path: faces/4.1
        status: updated
      - path: bean-validation/3.1
        status: updated
      - path: security/4.0
        status: updated
      - path: debugging/2.0
        name: "Debugging Support 2.0"
        status: not-updated
      - path: servlet/6.1
        status: updated
      - path: enterprise-beans/4.0
        name: "Enterprise Beans Lite 4.0"
        status: not-updated
      - path: tags/3.0
        status: not-updated
      - path: transactions/2.0
        status: not-updated

  - id: core_profile
    title: "Jakarta EE 11 <strong>Core Profile</strong>"
    width: single
    grid: false
    specs:
      - path: restful-ws/4.0
        status: updated
      - path: jsonp/2.1
        status: not-updated
      - path: jsonb/3.0
        status: not-updated
      - path: annotations/3.0
        status: updated
      - path: interceptors/2.2
        status: updated
      - path: dependency-injection/2.0
        status: not-updated
      - path: cdi/4.1
        name: "CDI Lite 4.1"
        status: updated

# Legend configuration
legend:
  - status: updated
    label: Updated
    box_class: bg-primary-dark-purple
    text_class: text-white
  - status: not-updated
    label: Not Updated
    box_class: bg-blue-ish-grey
    text_class: text-black
  - status: new
    label: New
    box_class: bg-primary-orange
    text_class: text-white
