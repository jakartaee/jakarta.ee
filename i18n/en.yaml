jakarta-ee-version-11-features-title: features and benefits
jakarta-ee-version-11-features-subtitle: "    Jakarta EE 11 marks a significant step forward in simplifying enterprise\n    Java with a strong focus on increasing developer productivity and\n    performance. Key highlights include modernizing and restructuring the Test\n    Compatibility Kits (TCKs), the new Jakarta Data specification, major\n    updates to the existing specifications, and support for the latest Java LTS\n    release which enables developers to leverage enhancements in Java 21,\n    including Virtual Threads.\n  "
jakarta-ee-version-11-features-block1-title: Developer<br> Productivity
jakarta-ee-version-11-features-block1-summary: |2
    The new Jakarta Data specification simplifies data access and enhances
    productivity by separating persistence logic across databases from the model
    using a simple interface.
jakarta-ee-version-11-modal-productivity-body: "  <p>\n    <span class=\"h5 fw-700 margin-top-0\">Jakarta Data</p> The new Jakarta Data\n    specification simplifies data access and enhances productivity by\n    separating persistence logic across databases from the model using a simple\n    interface. Key features include:\n  </p>\n    <ul>\n      <li>\n        <strong>BasicRepository</strong>: A built-in repository supertype for\n        performing basic operations on entities.\n      </li>\n      <li>\n        <strong>CrudRepository</strong>: Facilitates basic CRUD operations,\n        making database interactions more straightforward and less error-prone.\n      </li>\n      <li>\n        <strong>Pagination</strong>: Support for two types of pagination:\n        offset and cursor.\n      </li>\n      <li>\n        <strong>Jakarta Data Query Language</strong>: A streamlined query\n        language designed to specify the semantics of query methods within\n        Jakarta Data repositories.\n      </li>\n    </ul>\n    <h4 class=\"h5 fw-700\">Streamlining the Platform</h4>\n    <ul>\n      <li>\n        <strong>The Removal of Managed Beans</strong>: The Managed Beans\n        specification has been deprecated and removed from Jakarta EE 11 and\n        replaced by CDI (Context and Dependency Injection) alternatives.\n      </li>\n      <li>\n        <strong>The removal of all references to the Java SE SecurityManager</strong>:\n        Aligning with JEP 411, all references to SecurityManager have been\n        removed, paving the way for more modern security practices.\n      </li>\n      <li>\n        <strong>The removal of optional features to lower the barrier for new vendors</strong>:\n        All optional specifications have been removed in Jakarta EE 11.\n      </li>\n      <li>\n        <strong>Embracing Java Records</strong>: Continued support for Java\n        Records with various specifications (e.g. Java Validation) to ensure\n        data integrity and reduce boilerplate code\n      </li>\n    </ul>\n "
jakarta-ee-version-11-modal-productivity-title: Developer Productivity
jakarta-ee-version-11-features-block2-title: Performance
jakarta-ee-version-11-modal-performance-title: Performance
jakarta-ee-version-11-features-block2-summary: "  The new release supports Java 17 or higher, with unique enhancements for those using Java 21 or above, such as:\n "
jakarta-ee-version-11-modal-performance-body: "    <p>\n      <strong>Java Platform Support</strong>: The new release supports Java 17 or\n      higher, with unique enhancements for those using Java 21 or above, such as:\n    </p>\n    <ul>\n      <li>\n        <strong>Virtual Threads</strong>: The updated Concurrency specification\n        enables developers to leverage virtual threads in Java 21 to\n        significantly boost performance, allowing more efficient handling of\n        concurrent tasks without the overhead of traditional thread management.\n      </li>\n    </ul>\n "
jakarta-ee-version-11-modal-key-updates-title: Jakarta EE 11's Key Updates
jakarta-ee-version-11-modal-key-updates-body: "    <p>\n      <strong>Key updates include:</strong>\n    </p>\n    <ul>\n      <li>\n        Java SE Records can now be marked as <code>@Embeddable</code> or\n        <code>@IdClass</code> in Jakarta Persistence 3.2.\n      </li>\n      <li>\n        Validation rules can be applied to Java SE Records in Jakarta\n        Validation 3.1.\n      </li>\n      <li>\n        Jakarta Persistence 3.2 automatically maps\n        <code>java.time.Instant</code> and <code>java.time.Year</code> as\n        built-in types.\n      </li>\n      <li>\n        The use of <code>java.util/java.sql</code>,\n        <code>Date/Time/Timestamp/Calendar</code> and <code>@Temporal</code> is\n        deprecated in Persistence 3.2, in favor of the <code>java.time</code>\n        API.\n      </li>\n      <li>\n        An <code>EntityManager</code> can now be <code>@Injected</code> with a\n        defined Jakarta Contexts and Dependency Injection (CDI) scope in\n        Persistence 3.2.\n      </li>\n      <li>\n        Jakarta Concurrency 3.1 introduces support for Java SE Virtual Threads\n        in managed resources, such as via\n        <code>@ManagedExecutorDefinition</code>.\n      </li>\n      <li>\n        Persistence 3.2 enhances query capabilities with various SQL-like\n        features such as <code>concat</code> (<code>||</code>),\n        <code>union</code>, <code>intersect</code>, <code>except</code>,\n        <code>cast</code>, <code>left</code>, <code>right</code>, and\n        <code>replace</code>.\n      </li>\n      <li>\n        Persistence units can be configured using Java, providing an\n        alternative to the <code>persistence.xml</code> file in Persistence\n        3.2.\n      </li>\n      <li>\n        Producers can now specify an <code>@Priority</code> using CDI 4.1.\n      </li>\n      <li>\n        The <code>@Context</code> annotation has been deprecated in Jakarta\n        RESTful Web Services 4.0.\n      </li>\n      <li>\n        Specifications for Jakarta SOAP with Attachments and Jakarta XML\n        Binding have been removed from the Jakarta EE 11 platform.\n      </li>\n      <li>\n        The requirement for Common Object Request Broker Architecture (CORBA)\n        interoperability has been eliminated.\n      </li>\n      <li>\n        The <code>@jakarta.annotation.ManagedBean</code> annotation is\n        deprecated.\n      </li>\n      <li>\n        All specifications in Jakarta EE 11 have removed dependencies on the\n        Java SE <code>SecurityManager</code>.\n      </li>\n    </ul>\n  "
jakarta-ee-version-11-features-block3-title: Lightweight
jakarta-ee-version-11-features-block3-summary: Jakarta EE 10 defines a new profile specification with Jakarta EE Core Profile 10. The “Core Profile” which defines a multi-vendor platform for modernized and lightweight Java applications and microservices.
jakarta-ee-version-11-features-block3-text: The new Core Profile provides a subset of Jakarta EE specifications that target smaller runtimes suitable for microservices development with lightweight runtimes.This includes an innovative new CDI-Lite specification for building lightweight Jakarta EE applications.
jakarta-ee-version-11-specifications-title: "  Jakarta EE 11 brings significant API enhancements across multiple\n  specifications, incorporating features highly anticipated by the global\n  community.\n  "
jakarta-ee-version-11-specifications-text: 'Key updates include:'
jakarta-ee-version-11-specifications-list1: "  Java SE Records can now be marked as <code>@Embeddable</code> or\n  <code>@IdClass</code> in Jakarta Persistence 3.2.\n "
jakarta-ee-version-11-specifications-list2: "  Validation rules can be applied to Java SE Records in Jakarta Validation 3.1.\n "
jakarta-ee-version-11-specifications-list3: "  Jakarta Persistence 3.2 automatically maps <code>java.time.Instant</code> and\n  <code>java.time.Year</code> as built-in types.\n "
jakarta-ee-version-11-specifications-list4: "  The use of <code>java.util/java.sql</code>,\n  <code>Date/Time/Timestamp/Calendar</code> and <code>@Temporal</code> is\n  deprecated in Persistence 3.2, in favour of the <code>java.time</code> API.\n "
jakarta-ee-version-11-specifications-list5: "  An <code>EntityManager</code> can now be <code>@Injected</code> with a\n  defined Jakarta Contexts and Dependency Injection (CDI) scope in Persistence\n  3.2.\n "
jakarta-ee-version-11-community-video-title: Jakarta EE 11<br>Community Interviews
jakarta-ee-version-11-community-video-description: "  Jakarta EE 11 is here and we want to celebrate our dedicated community by\n  highlighting the passion and creativity that helped make this release\n  possible. Let's hear it from our community members about what this new\n  release means to them.\n "
