pages-get-involved-BecomeACommitter-title: Become a Committer
pages-get-involved-BecomeACommitter-content: '<p>Jakarta EE contributors are eligible to become committers. Becoming a committer can happen in a couple of ways: 1) For existing Jakarta EE projects, it happens through an election! After you have made contributions that demonstrate that you understand how the open source project works, a current committer on that project will initiate an election. Current committers must vote in the election; so creating a public record of high quality contributions that committers (and the community) can review is the most important part of this entire process. 2) Another option is to become a committer of a new Jakarta EE Specification project, by making initial contributions. The corresponding Project Management Committee (PMC) of the project nominates an initial set of committers for approval by the Executive Director (or his delegates).</p><p>If your employer is a member of the Jakarta EE Working Group, they&rsquo;ve already signed the necessary paperwork and there is no paperwork for you to complete.</p> <p>If your employer is not a member of the Jakarta EE Working Group, you will need to complete the following forms:</p>'
pages-get-involved-BecomeACommitter-IndividualAgreement: Jakarta EE Working Group Individual Participation Agreement
pages-get-involved-BecomeACommitter-EmployerAgreement: Employer Consent Agreement for Eclipse Foundation Specification Projects
pages-get-involved-BecomeACommitter-Handbook: 'For more details about the role of a committer and the Eclipse Foundation development process, see the <a href="https://www.eclipse.org/projects/handbook/" target="_blank" rel="noopener noreferrer">Eclipse Foundation Project Handbook</a>.'
pages-get-involved-JoinWG-title: Join the Jakarta EE Working Group
pages-get-involved-JoinWG-content: <p>Any individual or organization with an interest in advancing Jakarta EE can join the Jakarta EE Working Group.</p> <p><img class="get-involved-orange-icon" src="/images/get-involved/icons/reward.svg" alt="Reward icon">Review the <a href="https://www.eclipse.org/org/workinggroups/jakarta_ee_charter.php">Jakarta EE Working Group Charter</a>, <em class="margin-right-10">then</em> <img class="get-involved-orange-icon" src="/images/get-involved/icons/envelope.svg" alt="Envelope icon"><a href="https://accounts.eclipse.org/contact/membership/jakarta-ee">contact us</a>.</p><p>For more information, explore the <a href="https://jakarta.ee/">Jakarta EE website</a>.</p>
