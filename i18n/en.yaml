pages-get-involved-getinvolved-content: <p>To get involved in any Jakarta EE project or initiative, start by <a href="https://accounts.eclipse.org/user/register">creating an Eclipse Foundation account</a>.</p><p>Once you have an account, you can choose any of the methods below to participate.</p>
