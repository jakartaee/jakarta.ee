jakarta-ee-version-10-features-title: features and benefits
jakarta-ee-version-10-features-subtitle: Jakarta EE 10 is packed with new features for building modernized, simplified, and lightweight cloud native Java applications. This new innovative community-driven release is designed for organizations looking to start developing new enterprise Java applications or advancing their existing ones.
jakarta-ee-version-10-features-block1-title: Modernized
jakarta-ee-version-10-features-block1-summary: The Jakarta EE 10 release provides new functionality in over 20 component specifications.
jakarta-ee-version-10-features-block1-text: This release enables builders of modern cloud native Java applications to develop and deploy Jakarta EE 10 applications on Java SE 11 as well as Java SE 17, the most current LTS release of Java SE. This allows developers to take full advantage of new features including the modular system introduced in Java SE 9 and supported in Java SE 11
jakarta-ee-version-10-features-block2-title: Simplified
jakarta-ee-version-10-features-block2-summary: With Jakarta EE 10, application development is made simpler by supporting the broader use of additional annotations
jakarta-ee-version-10-features-block2-text: This makes it easier to build modularized applications and offers improved integration across component APIs. Ultimately, Jakarta EE 10 helps developers more easily implement applications with modern security requirements, remove deprecated APIs, and maintain high levels of compatibility with prior Jakarta EE releases.
jakarta-ee-version-10-features-block3-title: Lightweight
jakarta-ee-version-10-features-block3-summary: Jakarta EE 10 defines a new profile specification with Jakarta EE Core Profile 10. The “Core Profile” which defines a multi-vendor platform for modernized and lightweight Java applications and microservices.
jakarta-ee-version-10-features-block3-text: The new Core Profile provides a subset of Jakarta EE specifications that target smaller runtimes suitable for microservices development with lightweight runtimes.This includes an innovative new CDI-Lite specification for building lightweight Jakarta EE applications.
jakarta-ee-version-10-specifications-title: Jakarta EE 10 Specifications
jakarta-ee-version-10-specifications-text: 'Jakarta EE 10 delivers noteworthy API upgrades in over 20 specifications and adds important features requested by our global community. These enhancements include:'
jakarta-ee-version-10-specifications-list1: Jakarta Contexts and Dependency Injection (CDI) 4.0, including CDI-Lite that enables build time extensions
jakarta-ee-version-10-specifications-list2: Jakarta Security 3.0 supporting OpenID Connect
jakarta-ee-version-10-specifications-list3: Jakarta Servlet 6.0 for simplified programming and improved security
jakarta-ee-version-10-specifications-list4: Jakarta Faces (JSF) 4.0 with a modernized API using CDI
jakarta-ee-version-10-specifications-list5: Jakarta JSON Binding (JSON-B) 3.0 with new support for polymorphic types
jakarta-ee-version-10-specifications-list6: Jakarta RESTful Web Services standardizes a Java SE Bootstrap API and standard support for multipart/form-data
jakarta-ee-version-10-specifications-list7: Jakarta Persistence standardizing UUID as Basic Type and extending Query language and Query API
jakarta-ee-version-10-specifications-list8: Jakarta Concurrency 3.0 is moved to the Web Profile and enhances parallel and reactive programming models available to applications
