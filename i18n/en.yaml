pages-compatibility-get-listed-how-get-listed-text: 'To get your product listed on the Compatible Products page and in order to be able to use Jakarta EE Compatible logo, please follow these steps:'
pages-compatibility-get-listed-branding-requirements-title: Branding and compatible logo requirements
pages-compatibility-get-listed-branding-requirements-join-working-group: <a href="https://jakarta.ee/membership/">Join</a> the Jakarta EE Working Group
pages-compatibility-get-listed-branding-requirements-trademark-guidelines: Get familiar with <a href="https://jakarta.ee/legal/trademark_guidelines/">Jakarta EE Trademark Guidelines</a>.
pages-compatibility-get-listed-branding-requirements-license-agreement: Execute (digitally sign) the <a href="https://app.hellosign.com/s/Aoi0Sx4E">Jakarta EE Compatibility Trademark License Agreement</a> (or print the <a href="/legal/trademark_guidelines/jakarta-ee-trademark-license.pdf">License Agreement PDF</a> and return the signed agreement to <a href="mailto:emo-records@eclipse.org">emo-records@eclipse.org</a>)
pages-compatibility-get-listed-certification-requirements-title: Certification and listing on jakarta.ee Compatible Product pages requirements
pages-compatibility-get-listed-certification-requirements-tck-title: Follow the <a href="https://jakarta.ee/committees/specification/tckprocess/">Jakarta EE TCK process</a> to completely run and satisfy all of the requirements of the applicable TCK test
pages-compatibility-get-listed-certification-requirements-tck-publish: Publish the TCK results and maintain the public listing of your TCK results for as long as you continue to claim compatibility.
pages-compatibility-get-listed-certification-requirements-tck-email: Email the TCK results to <a href="mailto:tck@eclipse.org">tck@eclipse.org</a>
pages-compatibility-get-listed-certification-requirements-file-request: File a <a href="https://raw.githubusercontent.com/jakartaee/specification-committee/master/compatibility-certification-request.md">Certification Request</a> with a specification project in the <a href="https://github.com/eclipse-ee4j/jakartaee-platform">GitHub repository</a>
pages-compatibility-get-listed-certification-requirements-open-issue: Open a <a href="https://github.com/jakartaee/jakarta.ee/issues/new?template=compatibility.md">GitHub issue</a> against the Jakarta EE Compatible Products repository and fill in the required information
