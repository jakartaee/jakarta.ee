home-events-paragraph: '**Join developers, contributors, and Jakarta EE enthusiasts** from around the globe as we gather — online and in person — for a series of upcoming events, meet-ups, and livestreams.'
home-events-view-all-events: View all events
home-jumbotron-get-started-title: Get started
home-jumbotron-get-started-desc: Generate a Jakarta EE project template
pages-about-jakarta-ee-v2-what-is-title: 'What is <span class="text-secondary">Jakarta EE?</span>'
pages-about-jakarta-ee-v2-what-is-description: Jakarta EE is an open, vendor-neutral standard for building reliable, cloud native enterprise Java applications. It defines core technologies that modern Java applications rely on, even across different frameworks. Each Jakarta EE technology is defined by a specification, a set of rules that describe how it should behave, ensuring applications remain portable, predictable, and consistent across platforms, without vendor lock-in.
pages-about-jakarta-ee-v2-final-spec-prelude: 'To ensure consistent behavior across platforms, Jakarta EE defines specifications rules that describe how each technology should behave. These are supported by three key elements:'
pages-about-jakarta-ee-v2-final-spec-title: Final Specification
pages-about-jakarta-ee-v2-spec-doc-label: Specification Document
pages-about-jakarta-ee-v2-api-label: API
pages-about-jakarta-ee-v2-tck-label: TCK
pages-about-jakarta-ee-v2-compatible-implementations-label: Compatible Implementation(s)
pages-about-jakarta-ee-v2-spec-includes-title: 'Every Jakarta EE specification includes:'
pages-about-jakarta-ee-v2-spec-doc-card-title: A Specification Document
pages-about-jakarta-ee-v2-spec-doc-card-description: A human-readable description of the technology
pages-about-jakarta-ee-v2-api-card-title: An API
pages-about-jakarta-ee-v2-api-card-description: The programming interface developers use in their applications.
pages-about-jakarta-ee-v2-tck-card-title: A TCK (Technology Compatibility Kit)
pages-about-jakarta-ee-v2-tck-card-description: The test suite used to verify that an implementation fulfils the requirements of the specification
pages-about-jakarta-ee-v2-compatible-implementation-note: An implementation that passes the TCK becomes a Compatible Implementation, a guarantee for consistent behaviour across platforms.
pages-about-jakarta-ee-v2-why-it-matters-heading: '<span class=''text-secondary''>Why</span> it matters'
pages-about-jakarta-ee-v2-why-it-matters-description: 'Jakarta EE combines proven enterprise reliability with modern cloud native flexibility. No other Java framework offers the same depth of maturity and adaptability:'
pages-about-jakarta-ee-v2-why-it-matters-corner-image-alt: person coding
pages-about-jakarta-ee-v2-why-it-matters-item1-title: Proven stability
pages-about-jakarta-ee-v2-why-it-matters-item1-description: Decades of enterprise use ensure reliability, maturity, and strong backward compatibility
pages-about-jakarta-ee-v2-why-it-matters-item2-title: Developer efficiency
pages-about-jakarta-ee-v2-why-it-matters-item2-description: Java developers can concentrate on implementing business logic instead of recreating the common infrastructure code that all enterprise applications require.
pages-about-jakarta-ee-v2-why-it-matters-item3-title: Architectural flexibility
pages-about-jakarta-ee-v2-why-it-matters-item3-description: Whether your applications are monolithic or microservice-based, Jakarta EE supports a range of deployment models and design choices, all while maintaining cross-vendor compatibility.
pages-about-jakarta-ee-v2-why-it-matters-item4-title: Future-ready design
pages-about-jakarta-ee-v2-why-it-matters-item4-description: Seamlessly evolve your applications by switching underlying technologies to meet new performance and scalability demands
pages-about-jakarta-ee-v2-from-spec-title: '<span class="text-secondary">From specification</span> to implementation'
pages-about-jakarta-ee-v2-from-spec-quote: How a Jakarta EE specification comes to life
pages-about-jakarta-ee-v2-from-spec-description: To be officially recognized as a Jakarta EE Specification, there must be at least one open source Compatible Implementation that passes all required TCK tests.
pages-about-jakarta-ee-v2-from-spec-cta: Explore the compatible products
pages-about-jakarta-ee-v2-power-of-compatibility-title: '<span class="text-secondary">The power</span> of compatibility'
pages-about-jakarta-ee-v2-power-of-compatibility-description: 'Jakarta EE''s compatibility model ensures that developers and organisations can rely on consistent behavior, regardless of vendor or deployment environment. This is what makes Jakarta EE the trusted standard for enterprise Java worldwide.'
pages-about-jakarta-ee-v2-power-of-compatibility-cta: Get your product listed as compatible
pages-about-jakarta-ee-v2-learn-more-title: '<span class="text-secondary">Learn more</span> / get involved'
pages-about-jakarta-ee-v2-learn-more-quote: Join the global Jakarta EE community
pages-about-jakarta-ee-v2-learn-more-description: Jakarta EE thrives through collaboration from specification authors and implementers to developers building on the platform. Get involved to shape the future of enterprise Java.
