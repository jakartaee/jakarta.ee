pages-about-working-group-overview-title: Influence the Future of Cloud Native Java
pages-about-working-group-overview-text: <p>The Jakarta EE Working Group is the global community of leading technology organizations and individuals that collaborate to ensure <a href="/about/jakarta-ee">Jakarta EE</a> remains relevant and continues to evolve as a true, open platform for innovation. </p>
pages-about-working-group-overview-list: <p>To drive broad adoption of Jakarta EE, working group members strive to:</p><ul><li>Deliver more frequent Jakarta EE releases</li><li>Simplify the process for Jakarta EE compatibility certification</li><li>Grow the Jakarta EE community with members of all sizes and from diverse industries</li><li>Manage and increase awareness of the Jakarta EE brand on behalf of the community&nbsp;</li></ul>
pages-about-working-group-level-playing-field-title: A Level Playing Field Opens the Door to All
pages-about-working-group-level-playing-field-text: <p>The <a href="https://www.eclipse.org/org/documents/">vendor neutral governance model at the Eclipse Foundation</a> ensures every Jakarta EE Working Group member has an equal voice, no matter what size their organization is or how involved they are in the Eclipse Foundation.</p>
pages-about-working-group-level-playing-field-list: <p>The working group operates based on the Jakarta EE Working Group <a href="https://www.eclipse.org/org/workinggroups/jakarta_ee_charter.php">charter</a> that:</p><ul><li>Establishes the scope, goals, and vision for the ecosystem</li><li>Identifies all policies, processes, and guidelines the working group must follow</li><li>Defines the membership levels, types, and fees</li><li>Explains the power and duties of each working group committee</li><li>Outlines the rules for working group meetings</li></ul>
pages-about-working-group-flexible-membership-options-title: Flexible Membership Options
pages-about-working-group-flexible-membership-options-text: Each working group participant can choose the membership level that matches their size, budget, and business goals. This flexibility means organizations at all stages of development can afford to join. And special, fee-free membership levels allow individuals to participate.
pages-about-working-group-testimonials: We were very surprised and pleased to learn we would be on equal terms with the big vendors, with the same voice and the same vote as they have on the projects we participate in. As a small company, that opportunity is extremely important for our growth and success. Just having our logo next to theirs is fantastic for us from a brand awareness perspective.
