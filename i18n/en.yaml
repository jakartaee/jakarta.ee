pages-get-involved-HowToContribute-title: How to Contribute
pages-get-involved-HowToContribute-content: <p>Select a <a href="https://github.com/eclipse-ee4j">Jakarta EE project of interest</a>, join the project&rsquo;s mailing list and start communicating with the team.</p><p>Before starting to contribute, you need to make sure your paperwork is in order. When contributing as an individual, login to your EF account and sign the Eclipse Contributor Agreement. You can then work with the project team to contribute your work. Visit the <a href="https://www.eclipse.org/legal/ECA.php">Eclipse Contributor Agreement</a> page to learn more about the agreement. However, in the case your employer is already a member of the Jakarta EE Working Group, your employer has a <a href="https://www.eclipse.org/legal/committer_process/EclipseMemberCommitterAgreement.pdf">Member Committer and Contributor Agreement</a> in place that covers all their employees who are contributing, and you do not need to do anything!</p>
