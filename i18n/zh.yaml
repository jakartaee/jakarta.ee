pages-supporters-sponsor-header-description: <p class="fw-500">成为 Jakarta EE 工作组的赞助商，</p><h2 class="big-text uppercase text-secondary">推动未来企业级Java的发展</h2><p class="section-featured-text text-primary">您的组织将在塑造开源企业级Java的未来以及确保全球Java社区持续增长和成功方面发挥关键作用。</p>
