jakarta-ee-version-10-features-title: 特性和收益
jakarta-ee-version-10-features-subtitle: ' Jakarta EE 10充满了用于构建现代化、简化和轻量级云原生Java应用程序的新功能。这个由社区驱动的新的创新性发布版本是为那些希望开始开发新的企业Java应用程序或推进现有应用程序的组织而设计的。'
jakarta-ee-version-10-features-block1-title: 现代化的
jakarta-ee-version-10-features-block1-summary: The Jakarta EE 10 版本在20个组件规范中提供了新的功能特性。
jakarta-ee-version-10-features-block1-text: ' 此版本使现代云原生Java应用程序的构建者能够在Java SE 11以及Java SE 17上开发和部署Jakarta EE 10应用程序（Java SE 17是Java SE的最新LTS版本（。这使开发人员能够充分利用Java SE的很多新功能，包括Java SE 9中引入并在Java SE 11中得到支持的模块化系统。'
jakarta-ee-version-10-features-block2-title: 简化的
jakarta-ee-version-10-features-block2-summary: Jakarta EE 10通过支持更广泛地使用额外的注解，简化了应用程序开发。
jakarta-ee-version-10-features-block2-text: 这使得构建模块化应用程序更加容易，并改进了跨组件的API集成。最终，Jakarta EE 10帮助开发人员更轻松地实现具有现代安全要求的应用程序，删除已弃用的API，并保持与之前的Jakarta EE版本的高度兼容性。
jakarta-ee-version-10-features-block3-title: 轻量级
jakarta-ee-version-10-features-block3-summary: Jakarta EE 10定义了一个新的配置规范，即Jakarta EE Core Profile 10，使得开发轻量级和现代化的Java应用程序成为可能。
jakarta-ee-version-10-features-block3-text: 新的Core Profile提供了一组针对较小运行时的Jakarta EE规范子集，适用于使用轻量级运行时开发微服务。这包括一个创新的新CDI-Lite规范，用于构建轻量级的Jakarta EE应用程序。
jakarta-ee-version-10-specifications-title: Jakarta EE 10 规范
jakarta-ee-version-10-specifications-text: Jakarta EE 10在20多个规范中提供了值得注意的API升级，并针对来自全球Jakarta EE社区的请求添加了很多重要功能。这些增强包括：
jakarta-ee-version-10-specifications-list1: Jakarta Contexts and Dependency Injection (CDI) 4.0, 包括支持构建时扩展的 CDI-Lite
jakarta-ee-version-10-specifications-list2: '支持 OpenID Connect 的 Jakarta Security 3.0 '
jakarta-ee-version-10-specifications-list3: 简化编程和改进安全性的Jakarta Servlet 6.0
jakarta-ee-version-10-specifications-list4: Jakarta Faces (JSF) 4.0，提供经CDI现代化的API
jakarta-ee-version-10-specifications-list5: Jakarta JSON Binding (JSON-B) 3.0，具有对多态类型的新支持。
jakarta-ee-version-10-specifications-list6: Jakarta RESTful Web Services 标准化了一个 Java SE Bootstrap API 并且提供了对 multipart/form-data 标准支持
jakarta-ee-version-10-specifications-list7: Jakarta Persistence 将 UUID 标准化为 Basic Type 并且扩展了 Query language 和 Query API
jakarta-ee-version-10-specifications-list8: Jakarta Concurrency 3.0 划归 Web Profile 增强了应用程序可用的并行和反应式编程模型
