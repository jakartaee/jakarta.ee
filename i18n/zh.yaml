pages-membership-title: 塑造云原生、开源Java的未来
pages-membership-text: <p>全球企业级Java生态的领导者，包括 Fujitsu、IBM、Oracle、Red Hat 和 Tomitribe ，正共同努力，推动 Java EE 和 Jakarta EE 对关键应用和负载向云端迁移的支持。 </p><p>加入 Jakarta EE 工作组表明您不仅致力于 Jakarta EE 的发展和可持续性，而且还致力于确保一个治理良好、供应商中立的开源生态系统的增长和发展，这将使所有人受益。</p>
pages-membership-benefits-title: 收益
pages-membership-benefits-text: <p>Jakarta EE 工作组的成员享有如下的机会：</p><ul><li>保护您在Java EE 领域的战略投资，并确保您的技术栈和开发人员技能与下一代技术同步</li><li>参与定义Jakarta EE 的战略场景和优先事项，以您及您的客户的需求和用例来发展 Jakarta EE 平台</li><li>深入了解和影响 Jakarta EE 的技术路线图</li><li>影响 Jakarta EE 规范过程的定义、演进和执行</li><li>在规范管理的发展规划框架下参与开放的协作</li><li>确保您的开发团队从分享构建下一代企业Java应用的最佳实践和前瞻洞见中获得收益</li></ul>
