pages-learn-index-jakarta-ee-overview-course-instructor-describe: 'Java Champion and Jakarta EE Developer '
pages-learn-index-jakarta-ee-overview-course-describe: 您是否需要了解Jakarta EE的整体情况？在本课程中，Java Champion和Jakarta EE开发者布道师Ivar Grimstad将指导您了解Jakarta EE的目的和您需要了解的规范。Ivar快速概述了Jakarta EE、其规范和实现、将用于不同组件类型的容器以及用于部署的标准单元。他在Jakarta EE平台上进行了更深入的研究，然后深入到Web概要文件和核心概要文件。本课程包含了有用的提示和实际挑战，可以帮助您决定Jakarta EE之旅的下一步行动。
