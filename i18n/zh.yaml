pages-supporters-sponsor-usage-description: Jakarta EE 成员标志可由战略成员、企业成员、参与成员和个体提交者成员使用，这些成员必须是工作组的当前成员，以标识他们的参与并表达他们对该计划的支持。使用 Jakarta EE 成员标志需遵守 Jakarta EE 商标指南。
