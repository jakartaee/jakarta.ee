pages-supporters-sponsor-by-joining-support: <h3 class="heading-underline"><div class="small">您的</div><div>支持</div></h3><p class="featured-section-cta-item-body">将帮助我们维护和扩展我们的计划。</p>
pages-supporters-sponsor-by-joining-contribution: <h3 class="heading-underline"><div class="small">您的</div><div>贡献</div></h3><p class="featured-section-cta-item-body">将确保 Jakarta EE 社区继续成为世界各地开发者、企业和技术爱好者充满活力和创新的平台。</p>
pages-supporters-sponsor-by-joining-participation: <h3 class="heading-underline"><div class="small">您的</div><div>参与</div></h3><p class="featured-section-cta-item-body">将支持一系列旨在推广 Jakarta EE 的计划，包括营销和促销活动、活动、内容创作、社区赠品等。</p>
