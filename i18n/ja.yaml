pages-get-involved-WhyDevelopersInvolved-Experience-content: 技術をより深く理解し、経験豊富なエンジニアと業界リーダーのチームと協力して学ぶ機会を得る
pages-get-involved-WhyDevelopersInvolved-Recognition-title: 認知
pages-get-involved-WhyDevelopersInvolved-Recognition-content: 露出が増えて、コミュニティで自身の評判を築く
pages-get-involved-WhyDevelopersInvolved-Flexibility-title: 柔軟性
pages-get-involved-WhyDevelopersInvolved-Flexibility-content: 自分の時間で、世界のどこからでも貢献し、作業できる
pages-get-involved-WhyDevelopersInvolved-Impact-title: 影響
pages-get-involved-WhyDevelopersInvolved-Impact-content: クラウドネイティブやオープン ソースJavaの将来に影響を与え、Javaエコシステムの主要なプレイヤーと新しい関係を築きます。Jakarta EE仕様の質と普及によりJakarta EEを前進させ、それを実現するのに役立ったと知ることで満足感をえることができます。
