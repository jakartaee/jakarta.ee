pages-get-involved-getinvolved-content: <p>Jakarta EEプロジェクトやイニシアチブに参加するには、まず<a href="https://accounts.eclipse.org/user/register">Eclipse Foundationアカウントを作成</a>します。</p><p>アカウントを取得したら、以下のいずれかの方法で参加できます。</p>
pages-get-involved-jointheconversation-title: 会話に参加する
pages-get-involved-jointheconversation-content: 最新のコミュニティの取り組みについて学び、参加する方法を決めるために、ミュニケーションチャネルに参加してください。
