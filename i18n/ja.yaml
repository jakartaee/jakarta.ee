pages-get-involved-HowToContribute-title: 貢献の方法
pages-get-involved-HowToContribute-content: <p>興味のある<a href="https://github.com/eclipse-ee4j">Jakarta EEプロジェクト</a>を選び、プロジェクトのメーリングリストに参加してチームとコミュニケーションを取りましょう。</p><p>貢献を開始する前に、事務手続きが正しく行われていることを確認する必要があります。個人で貢献する場合は、EFアカウントにログインし、Eclipse Contributor Agreementに署名してください。その後、プロジェクトチームと協力して作業を行うことができます。契約の詳細については、<a href="https://www.eclipse.org/legal/ECA.php">Eclipse Contributor Agreement</a>ページを参照してください。ただし、雇用主がすでにJakarta EEワーキンググループメンバーである場合、雇用主は貢献している従業員すべてをカバーする<a href="https://www.eclipse.org/legal/committer_process/EclipseMemberCommitterAgreement.pdf">メンバーコミッタ寄稿同意書</a>があるため、何もする必要はありません。</p>
pages-get-involved-HowToContribute-button-LoginToEF: EFアカウントにログインします
pages-get-involved-BecomeACommitter-title: コミッターになる
pages-get-involved-BecomeACommitter-content: <p>Jakarta EE貢献者はコミッターになる資格があります。コミッターになるには、いくつかの方法があります。1) 既存のJakarta EEプロジェクトの場合、投票により選出されます。該当オープンソースプロジェクトがどのように機能するか理解していることを示す貢献を行った後、そのプロジェクトの現在のコミッターの一人が投票を開始します。現在のコミッターはそれに投票しなければなりません。そのため、コミッター（およびコミュニティ）がレビューできる質の高い貢献を公に積み重ねることが、このプロセス全体の中で最も重要な部分です。2) もう一つの選択肢は、初期貢献をすることで、新しいJakarta EE仕様プロジェクトのコミッターになることです。プロジェクトの対応するプロジェクト管理委員会（PMC）は、エグゼクティブディレクター（またはその代理）に承認をえるための初期コミッターを指名します。</p><p>雇用主がJakarta EEワーキンググループメンバーである場合、雇用主はすでに必要な書類に署名しており、あなたが用意する書類はありません。</p> <p>雇用主がJakarta EEワーキンググループのメンバーでない場合は、次のフォームに記入する必要があります。</p>
pages-get-involved-BecomeACommitter-IndividualAgreement: Jakarta EEワーキンググループIndividual Participation Agreement
pages-get-involved-BecomeACommitter-EmployerAgreement: Employer Consent Agreement for Eclipse Foundation Specification Projects
pages-get-involved-BecomeACommitter-Handbook: 'コミッターの役割とEclipse Foundationの開発プロセスの詳細については、<a href="https://www.eclipse.org/projects/handbook/" target="_blank" rel="noopener noreferrer">Eclipse Foundationプロジェクトハンドブック</a>を参照してください。'
pages-get-involved-JoinWG-title: Jakarta EEワーキンググループに参加する
pages-get-involved-JoinWG-content: <p>Jakarta EEの向上に関心を持つ個人または団体は、Jakarta EEワーキンググループに参加することができます。</p> <p><img class="get-involved-orange-icon" src="/images/get-involved/icons/reward.svg" alt="Reward icon"><a href="https://www.eclipse.org/org/workinggroups/jakarta_ee_charter.php">Jakarta EEワーキンググループチャーター</a>を確認し、<em class="margin-right-10"></em> <img class="get-involved-orange-icon" src="/images/get-involved/icons/envelope.svg" alt="Envelope icon"><a href="https://accounts.eclipse.org/contact/membership/jakarta-ee">お問い合わせください</a>。</p><p>詳細については、<a href="https://jakarta.ee/">Jakarta EEのWebサイト</a>を参照してください。</p>
