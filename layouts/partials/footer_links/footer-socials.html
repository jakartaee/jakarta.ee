<ul class="list-inline">
  {{- range .Site.Params.socials }}
    <li>
      <a class="social-icon" href="{{ .url }}">
        <i
          class="{{ .icon }}"
          aria-label="{{ i18n "footer-sr-social-account" .name }}"
        ></i>
      </a>
    </li>
  {{- end }}
</ul>
