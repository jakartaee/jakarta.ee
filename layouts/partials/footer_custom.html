{{ if ne .Page.Params.show_featured_footer false }}
  <div class="eclipsefdn-featured-footer featured-footer" id="featured-footer" data-publish-target="{{ .Page.Params.featured_content_publish_target | default .Site.Params.featured_content_publish_target | default "eclipse_org"}}">
    <div class="container">
      <div class="row">
        <div class="col-sm-24 featured-container">
        </div>
      </div>
    </div>
  </div>
{{ end }}
<div class="featured-footer featured-mailing-list text-center" id="social-media">
  <div class="container">
    <div class="row">
      <div class="col-sm-24">
        <ul class="list-inline">
          <li><a class="btn btn-primary margin-right-15" href="https://accounts.eclipse.org/mailing-list/jakarta.ee-wg">{{ i18n "footer-join-mailing-list-button-text" }}</a></li>
            {{- range .Site.Params.socials }}
            <li>
            <a class="social-icon" href="{{ .url }}">
              <i class="{{ .icon }} fa-xl" aria-label="{{ i18n "footer-sr-social-account" .name }}"></i><span class="sr-only">{{ i18n "footer-sr-social-account" .name }}</span>
            </a>
            </li>
            {{- end }}
        </ul>
      </div>
    </div>
  </div>
</div>
