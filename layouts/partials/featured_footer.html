{{ $show_featured_footer := .Page.Params.show_featured_footer | default .Site.Params.show_featured_footer | default true }}
{{ if $show_featured_footer }}
  <div
    class="eclipsefdn-featured-story featured-story collapsed"
    id="featured-story"
    tabindex="0"
    data-publish-target="{{ .Page.Params.featured_content_publish_target | default .Site.Params.featured_content_publish_target | default "eclipse_org" }}"
  >
    <button class="close" type="button">
      <i class="fa fa-times"></i><span class="sr-only">Close</span>
    </button>
    <div class="featured-container"></div>
  </div>
  <!--
    Placing this small script inline allows us to only load it when the page has the featured story enabled.
  -->
  <script>
    (function () {
      const fs = document.getElementById("featured-story");
      const closeBtn = fs.querySelector("button.close");

      let isOpen = false;
      let hasOpenedAutomatically = false;

      function toggleFeaturedStory() {
        if (fs.classList.contains("collapsed")) {
          fs.classList.remove("collapsed");
          isOpen = true;
        }
      }

      function closeFeaturedStory() {
        fs.classList.add("collapsed");
        isOpen = false;
      }

      function openFeaturedStory() {
        if (fs.classList.contains("collapsed")) {
          fs.classList.remove("collapsed");
          isOpen = true;
        }
      }

      fs.addEventListener("click", function (e) {
        if (fs.classList.contains("collapsed")) {
          toggleFeaturedStory();
        } else {
          // Prevent closing when clicking inside
          e.stopPropagation();
        }
      });

      fs.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (fs.classList.contains("collapsed")) {
            toggleFeaturedStory();
          }
        } else if (e.key === "Escape" && isOpen) {
          closeFeaturedStory();
        }
      });

      // Close when clicking outside
      document.addEventListener("click", function (e) {
        if (isOpen && !fs.contains(e.target)) {
          closeFeaturedStory();
        }
      });

      window.addEventListener("scroll", function () {
        if (!hasOpenedAutomatically) {
          // Open automatically once when the user scrolls down 25% of the above-the-fold content
          const scrollPosition = window.scrollY;
          const threshold = window.innerHeight * 0.25;
          if (scrollPosition > threshold) {
            openFeaturedStory();
            hasOpenedAutomatically = true;
          }
        }
      });

      // Close when clicking the close button
      // Also stops propagation to prevent re-opening
      closeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        closeFeaturedStory();
      });
    })();
  </script>
{{ end }}
