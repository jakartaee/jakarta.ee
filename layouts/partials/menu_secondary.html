{{ $class := "" }}
{{ if reflect.IsMap . }}
  {{ $class = .class }}
{{ end }}
{{ range site.Menus.secondary }}
  <li class="toolbar-menu-item {{ if $class }}{{ $class }}{{ end }}">
    <a href="{{ .URL }}" class="toolbar-menu-link">
      {{ .Pre }}
      <span>{{ .Name }}</span>
      {{ if .Post }}{{ .Post }}{{ end }}
    </a>
  </li>
{{ end }}
