<!-- Community-powered innovation section -->
<section
  id="community-powered-innovation"
  class="row bg-blue-image-2"
  aria-labelledby="community-innovation-heading"
>
  <div class="container">
    <div class="row">
      <div class="col-xs-24 text-center dark">
        <div class="contributor-bubbles-wrapper">
          <div
            class="card-list contributor-list contributor-bubbles"
            data-version="11"
          ></div>
          <div class="community-content">
            <h2 id="community-innovation-heading" class="featured-heading">
              {{ i18n "home-community-heading-line1" }}<br />
              <span class="text-secondary"
                >{{ i18n "home-community-heading-line2" }}</span
              >
            </h2>
            <p class="margin-top-30">
              {{ i18n "home-community-subtitle" | markdownify }}
            </p>
            <div class="margin-top-30">
              <a href="/contribute/" class="btn btn-secondary"
                >{{ i18n "home-community-contribute" }}
                <i class="fa fa-xs fa-chevron-right" aria-hidden="true"></i
              ></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
