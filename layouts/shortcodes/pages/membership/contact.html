{{- $heading := i18n "membership-contact-heading" -}}
{{- $paragraph := i18n "membership-contact-paragraph" -}}

<section id="contact" class="row padding-y-large">
  <div class="container">
    <div class="rounded-medium bg-blue-image-5 padding-20 md:padding-60">
      <div class="max-w-80 text-md-center margin-x-auto text-primary">
        <h2 class="featured-heading text-primary">{{ $heading }}</h2>
        <p>{{ $paragraph }}</p>

        <div class="card margin-top-large">
          {{ .Inner }}
        </div>
      </div>
    </div>
  </div>
</section>
