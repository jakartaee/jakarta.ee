map_hash_bucket_size 128;

map $uri $jakarta_canonical_link {
    default                                                               "";
    /specifications/faces/3.0/jakarta-faces-3.0.html                       '<https://jakarta.ee/specifications/faces/3.0/jakarta-faces-3.0>; rel="canonical"';
    /specifications/faces/3.0/jakarta-faces-3.0                            '<https://jakarta.ee/specifications/faces/3.0/jakarta-faces-3.0>; rel="canonical"';
    /specifications/platform/10/jakarta-platform-spec-10.0.html           '<https://jakarta.ee/specifications/platform/10/jakarta-platform-spec-10.0>; rel="canonical"';
    /specifications/platform/10/jakarta-platform-spec-10.0                '<https://jakarta.ee/specifications/platform/10/jakarta-platform-spec-10.0>; rel="canonical"';
    /specifications/webprofile/10/jakarta-webprofile-spec-10.0            '<https://jakarta.ee/specifications/webprofile/10/jakarta-webprofile-spec-10.0>; rel="canonical"';
    /specifications/webprofile/10/jakarta-webprofile-spec-10.0.html       '<https://jakarta.ee/specifications/webprofile/10/jakarta-webprofile-spec-10.0>; rel="canonical"';
    /specifications/coreprofile/10/jakarta-coreprofile-spec-10.0          '<https://jakarta.ee/specifications/coreprofile/10/jakarta-coreprofile-spec-10.0>; rel="canonical"';
    /specifications/coreprofile/10/jakarta-coreprofile-spec-10.0.html     '<https://jakarta.ee/specifications/coreprofile/10/jakarta-coreprofile-spec-10.0>; rel="canonical"';
    /specifications/authorization/2.1/jakarta-authorization-spec-2.1      '<https://jakarta.ee/specifications/authorization/2.1/jakarta-authorization-spec-2.1>; rel="canonical"';
    /specifications/authorization/2.1/jakarta-authorization-spec-2.1.html '<https://jakarta.ee/specifications/authorization/2.1/jakarta-authorization-spec-2.1>; rel="canonical"';
    /specifications/batch/2.1/jakarta-batch-spec-2.1                      '<https://jakarta.ee/specifications/batch/2.1/jakarta-batch-spec-2.1>; rel="canonical"';
    /specifications/batch/2.1/jakarta-batch-spec-2.1.html                 '<https://jakarta.ee/specifications/batch/2.1/jakarta-batch-spec-2.1>; rel="canonical"';
}

server {
    listen 8080;
    server_name localhost;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    add_header Link $jakarta_canonical_link;

    # Allow external domains to access font files (CORS).
    location /fonts/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # 301 redirects (ported from static/_redirects)

    location = /meeting_minutes {
        return 301 /about/meeting_minutes;
    }

    location /meeting_minutes/ {
        rewrite ^/meeting_minutes/(.*)$ /about/meeting_minutes/$1 permanent;
    }

    location = /newsletter {
        return 301 /community/newsletter;
    }

    location = /about {
        return 301 /about/working-group;
    }

    location = /compatibility/get_listed/ {
        return 301 /compatibility/get-listed/;
    }

    location = /events {
        return 301 /community/events;
    }

    location = /getinvolved {
        return 301 /community/get-involved;
    }

    # Proxy rules (ported from static/_redirects 200-masking rules)

    location /learn/docs/ {
        proxy_pass https://jakartaee.github.io/jakartaee-documentation/;
        proxy_ssl_server_name on;
        proxy_set_header Host jakartaee.github.io;
    }

    location /learn/jakartaee-tutorial/ {
        proxy_pass https://jakartaee.github.io/jakartaee-documentation/jakartaee-tutorial/;
        proxy_ssl_server_name on;
        proxy_set_header Host jakartaee.github.io;
    }

    location = /blogs/jakartablogs.xml {
        proxy_pass https://jakartablogs.ee/rss20.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host jakartablogs.ee;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
